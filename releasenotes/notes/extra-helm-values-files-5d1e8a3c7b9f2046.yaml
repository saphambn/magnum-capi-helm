---
features:
  - |
    Operators can now merge their own Helm values into every cluster with the
    new ``[capi_helm] extra_helm_values_files`` option, a list of YAML files.
    This allows clusters to use a private registry, a registry cache or an
    air-gapped cloud, by setting ``registryMirrors``, ``registryAuth``,
    ``trustedCAs`` and the add-on chart repositories of the
    ``openstack-cluster`` chart, or any other chart value. Later files take
    precedence over earlier ones, and the values generated by the driver take
    precedence over all of them. Mappings are merged, while lists and other
    values replace earlier ones, and ``null`` removes a chart default.
upgrade:
  - |
    Changing values in ``[capi_helm] extra_helm_values_files`` that end up in
    the node bootstrap configuration, such as ``registryMirrors``, replaces
    every node of a cluster on that cluster's next update.
security:
  - |
    The output of ``helm upgrade`` is no longer logged at debug level, as it
    contains the release values, which may include registry credentials.
